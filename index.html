<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opero — Heavy Equipment Operator Network</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    nav button {
      background: none;
      border: none;
      color: #aaa;
      margin-left: 15px;
      cursor: pointer;
      font-size: 14px;
    }

    nav button:hover {
      color: white;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 50px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons button,
    .form button {
      background: white;
      color: black;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .buttons button.secondary {
      background: #1b222c;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .card {
      background: #121820;
      border: 1px solid #242c35;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .muted {
      color: #9299a3;
    }

    button.text-link {
      padding: 0;
      border: 0;
      background: none;
      color: #d7dde5;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    .status-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border: 1px solid #303945;
      border-radius: 999px;
      background: #1b222c;
      color: #d7dde5;
      font-size: 13px;
    }

    .form {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      background: #121820;
      border: 1px solid #242c35;
      border-radius: 14px;
    }

    .form h2 {
      margin-bottom: 20px;
    }

    .form input,
    .form textarea,
    .form select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #303945;
      background: #0b0f14;
      color: white;
    }

    .form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 50px 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OPERO</div>

  <nav>
    <button onclick="showHome()">Home</button>
    <button onclick="showOperators()">Operators</button>
    <button onclick="showJobs()">Jobs</button>
    <button id="dashboardNav" class="hidden" onclick="showDashboard()">Dashboard</button>
    <button id="applicationsNav" class="hidden" onclick="showApplications()">Applications</button>
    <button id="loginNav" onclick="showLogin()">Login</button>
    <button id="registerNav" onclick="showRegister()">Register</button>
    <button id="profileNav" onclick="showProfile()">My Profile</button>
    <button id="logoutNav" class="hidden" onclick="logout()">Logout</button>
  </nav>
</header>


<section id="home">

  <div class="hero">

    <h1>Heavy Equipment Operator Network</h1>

    <p>
      Connect operators, companies and construction jobs.
    </p>

    <div class="buttons" id="homeCtas" aria-live="polite"></div>

  </div>

</section>


<section id="mainContent" class="container hidden">

  <div id="content"></div>

</section>

<section id="profileSection" class="hidden">

  <h2>My Profile</h2>

  <p class="muted">Account type: <strong id="profileAccountTypeLabel"></strong></p>

  <input id="profileName" type="text" placeholder="Full name">

  <input id="profilePhone" type="text" placeholder="Phone">

  <input id="profileCity" type="text" placeholder="City">

  <input id="profileCountry" type="text" placeholder="Country">

  <div id="operatorTypeProfileField" class="hidden">
    <label for="profileOperatorType">What equipment do you operate?</label>
    <select id="profileOperatorType">
      <option value="">Select operator type</option>
      <option value="Tower Crane Operator">Tower Crane Operator</option>
      <option value="Mobile Crane Operator">Mobile Crane Operator</option>
      <option value="Excavator Operator">Excavator Operator</option>
      <option value="Loader Operator">Loader Operator</option>
      <option value="Forklift Operator">Forklift Operator</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div id="operatorAvailabilityFields" class="hidden">
    <label for="profileIsEmployed">Currently employed?</label>
    <select id="profileIsEmployed" onchange="toggleReplacementProfileFields()">
      <option value="">Select yes or no</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label for="profileLookingPermanent">Looking for a permanent job?</label>
    <select id="profileLookingPermanent">
      <option value="">Select yes or no</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <div id="needsReplacementField" class="hidden">
      <label for="profileNeedsReplacement">Needs a replacement sometimes?</label>
      <select id="profileNeedsReplacement">
        <option value="">Select yes or no</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <div id="availableReplacementField" class="hidden">
      <label for="profileAvailableReplacement">Available to work as a replacement?</label>
      <select id="profileAvailableReplacement">
        <option value="">Select yes or no</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
  </div>

  <input id="profileExperience" type="number" placeholder="Experience years">

  <textarea id="profileAbout" placeholder="About you"></textarea>

  <button onclick="saveProfile()">Save Profile</button>

  <p id="profileStatus"></p>

</section>


<section id="loginSection" class="hidden">

  <div class="form">

    <h2>Login</h2>

    <input id="loginEmail" type="email" placeholder="Email">

    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p class="status" id="loginStatus"></p>

  </div>

</section>


<section id="registerSection" class="hidden">

  <div class="form">

    <h2>Create Operator Profile</h2>

    <input id="fullName" placeholder="Full name">

    <select id="accountType" aria-label="Account type">
      <option value="operator">I am an operator</option>
      <option value="company">I represent a company</option>
    </select>

    <input id="registerEmail" type="email" placeholder="Email">

    <input id="registerPassword" type="password" placeholder="Password">

    <input id="phone" placeholder="Phone">

    <input id="city" placeholder="City">

    <input id="country" value="Georgia" placeholder="Country">

    <select id="operatorType">

      <option value="">Operator type</option>
      <option>Tower Crane Operator</option>
      <option>Mobile Crane Operator</option>
      <option>Excavator Operator</option>
      <option>Forklift Operator</option>
      <option>Loader Operator</option>
      <option>Bulldozer Operator</option>
      <option>Other</option>

    </select>

    <input id="experience" type="number" placeholder="Experience (years)">

    <textarea id="about" placeholder="About you / experience"></textarea>

    <button onclick="register()">Create Account</button>

    <p class="status" id="registerStatus"></p>

  </div>

</section>


<footer>
  © 2026 Opero — Heavy Equipment Operator Network
</footer>


<script>

const SUPABASE_URL =
  "https://nghjkjrpsvmvpqntdbtp.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naGpranJwc3ZtdnBxbnRkYnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDQ5MjMsImV4cCI6MjEwNTgyMDkyM30.uWNx_dXsN_a3-BYmAG15NxBTIJugrCDaq5hkY49_HM0";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


function hideAll() {

  document.getElementById("home").classList.add("hidden");
  document.getElementById("mainContent").classList.add("hidden");
  document.getElementById("loginSection").classList.add("hidden");
  document.getElementById("registerSection").classList.add("hidden");
  document.getElementById("profileSection").classList.add("hidden");
}


function showHome() {

  hideAll();

  document.getElementById("home").classList.remove("hidden");

}


function showLogin() {

  hideAll();

  document.getElementById("loginSection").classList.remove("hidden");

}


function showRegister() {

  hideAll();

  document.getElementById("registerSection").classList.remove("hidden");

}


async function register() {

  const fullName =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const accountType =
    document.getElementById("accountType").value;

  const phone =
    document.getElementById("phone").value.trim();

  const city =
    document.getElementById("city").value.trim();

  const country =
    document.getElementById("country").value.trim();

  const operatorType =
    document.getElementById("operatorType").value;

  const experience =
    document.getElementById("experience").value;

  const about =
    document.getElementById("about").value.trim();

  const status =
    document.getElementById("registerStatus");


  status.textContent = "Creating account...";


  if (!fullName || !email || !password) {

    status.textContent =
      "Please enter name, email and password.";

    return;

  }


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {
  data: {
    full_name: fullName,
    account_type: accountType,
    phone: phone,
    city: city,
    country: country,
    operator_type: accountType === "operator" ? operatorType : null,
    experience_years: accountType === "operator" ? experience : null,
    about: about
  }
}

    });


  if (error) {

    status.textContent = error.message;

    return;

  }


  if (!data.user) {

    status.textContent =
      "Registration failed.";

    return;

  }


  status.textContent =
    "Account created. You can now login.";


  setTimeout(() => {

    showLogin();

  }, 1500);

}


async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const status =
    document.getElementById("loginStatus");


  status.textContent = "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    status.textContent = error.message;

    return;

  }


  status.textContent =
    "Login successful!";


  updateAuthUI(true);
  await updateHomeCTAs(data.user);
  await showDashboard();

}

async function showProfile() {
  hideAll();

  const profileSection = document.getElementById("profileSection");

  if (!profileSection) {
    alert("Profile section not found");
    return;
  }

  profileSection.classList.remove("hidden");

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("Please login first");
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (error) {
    console.error(error);
    alert("Could not load profile");
    return;
  }

  await repairEmploymentStatus(user.id, data);

  document.getElementById("profileAccountTypeLabel").textContent =
    data.account_type === "company" ? "Company" : "Operator";

  document.getElementById("profileName").value =
    data.full_name || "";

  document.getElementById("profilePhone").value =
    data.phone || "";

  document.getElementById("profileCity").value =
    data.city || "";

  document.getElementById("profileCountry").value =
    data.country || "Georgia";

  document.getElementById("operatorTypeProfileField").classList.toggle(
    "hidden", data.account_type !== "operator"
  );
  document.getElementById("profileOperatorType").value =
    data.account_type === "operator" ? data.operator_type || "" : "";
  document.getElementById("operatorAvailabilityFields").classList.toggle(
    "hidden", data.account_type !== "operator"
  );
  document.getElementById("profileIsEmployed").value = booleanToChoice(data.is_employed);
  document.getElementById("profileLookingPermanent").value = booleanToChoice(data.looking_for_permanent_job);
  document.getElementById("profileNeedsReplacement").value = booleanToChoice(data.needs_replacement);
  document.getElementById("profileAvailableReplacement").value = booleanToChoice(data.available_for_replacement);
  toggleReplacementProfileFields();

  document.getElementById("profileExperience").value =
    data.experience_years || "";

  document.getElementById("profileAbout").value =
    data.about || "";
}


function booleanToChoice(value) {
  return value === true ? "yes" : value === false ? "no" : "";
}

function choiceToBoolean(value) {
  return value === "yes" ? true : value === "no" ? false : null;
}

async function repairEmploymentStatus(userId, profile) {
  if (profile?.account_type !== "operator" || profile.is_employed !== true || profile.looking_for_permanent_job !== true) return;
  const { error } = await supabaseClient.from("profiles")
    .update({ looking_for_permanent_job: false })
    .eq("id", userId)
    .eq("is_employed", true)
    .eq("looking_for_permanent_job", true);
  if (error) console.error("Could not correct employment status:", error);
  profile.looking_for_permanent_job = false;
}

function toggleReplacementProfileFields() {
  const employed = document.getElementById("profileIsEmployed")?.value;
  const permanentJob = document.getElementById("profileLookingPermanent");
  if (permanentJob) {
    permanentJob.disabled = employed === "yes";
    if (employed === "yes") permanentJob.value = "no";
  }
  document.getElementById("needsReplacementField")?.classList.toggle("hidden", employed !== "yes");
  document.getElementById("availableReplacementField")?.classList.toggle("hidden", employed !== "no");
}

async function saveProfile() {

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    alert("Please login first");
    return;
  }

  const { data: profile, error: profileError } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).single();
  if (profileError || !profile) {
    alert("Could not load account type. Please reload and try again.");
    return;
  }

  const updates = {
    full_name: document.getElementById("profileName").value.trim(),
    phone: document.getElementById("profilePhone").value.trim(),
    city: document.getElementById("profileCity").value.trim(),
    country: document.getElementById("profileCountry").value.trim(),
    experience_years: Number(document.getElementById("profileExperience").value) || null,
    about: document.getElementById("profileAbout").value.trim()
  };
  if (profile.account_type === "operator") {
    const employed = choiceToBoolean(document.getElementById("profileIsEmployed").value);
    updates.operator_type = document.getElementById("profileOperatorType").value;
    updates.is_employed = employed;
    updates.looking_for_permanent_job = employed === true
      ? false
      : choiceToBoolean(document.getElementById("profileLookingPermanent").value);
    updates.needs_replacement = employed === true
      ? choiceToBoolean(document.getElementById("profileNeedsReplacement").value)
      : null;
    updates.available_for_replacement = employed === false
      ? choiceToBoolean(document.getElementById("profileAvailableReplacement").value)
      : null;
  }

  const { error } = await supabaseClient.from("profiles")
    .update(updates).eq("id", user.id);
  if (error) {
    alert(error.message);
    return;
  }

  alert("Profile updated successfully!");
}

async function logout() {

  await supabaseClient.auth.signOut();

  updateAuthUI(false);
  updateHomeCTAs(null);

  showHome();

}


function updateAuthUI(loggedIn) {
  document.getElementById("loginNav").classList.toggle("hidden", loggedIn);
  document.getElementById("registerNav").classList.toggle("hidden", loggedIn);
  document.getElementById("logoutNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("applicationsNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("dashboardNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("profileNav").classList.toggle("hidden", !loggedIn);
}

let homeCtaRequest = 0;

async function updateHomeCTAs(user) {
  const ctas = document.getElementById("homeCtas");
  if (!ctas) return;
  const requestId = ++homeCtaRequest;

  if (!user) {
    ctas.innerHTML = `
      <button onclick="showRegister()">Create Profile</button>
      <button class="secondary" onclick="showJobs()">Find Jobs</button>
    `;
    return;
  }

  ctas.innerHTML = "<span class=\"muted\">Loading your options...</span>";
  const { data: profile, error } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  if (requestId !== homeCtaRequest) return;

  if (error || !profile || !["operator", "company"].includes(profile.account_type)) {
    ctas.innerHTML = "<span class=\"muted\">Your account profile is not available yet.</span>";
    return;
  }

  if (profile.account_type === "operator") {
    ctas.innerHTML = `
      <button class="secondary" onclick="showJobs()">Find Jobs</button>
      <button onclick="showProfile()">My Profile</button>
      <button onclick="showDashboard()">Dashboard</button>
    `;
    return;
  }

  ctas.innerHTML = `
    <button class="secondary" onclick="showOperators()">Find Operators</button>
    <button onclick="showJobs()">Post a Job</button>
    <button onclick="showProfile()">My Profile</button>
    <button onclick="showDashboard()">Dashboard</button>
  `;
}

async function showDashboard() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }
  hideAll();
  const mainContent = document.getElementById("mainContent");
  const content = document.getElementById("content");
  mainContent.classList.remove("hidden");
  content.innerHTML = "<h2>Dashboard</h2><p class='muted'>Loading...</p>";

  const { data: profile, error } = await supabaseClient.from("profiles")
    .select("account_type, full_name, operator_type, city, experience_years, about")
    .eq("id", user.id).maybeSingle();
  if (error || !profile || !["operator", "company"].includes(profile.account_type)) {
    content.innerHTML = "<h2>Dashboard</h2><p class='muted'>Your account profile is not ready. Please sign out and sign in again, or contact support.</p>";
    return;
  }

  if (profile.account_type === "company") {
    content.innerHTML = `
      <h2>Company Dashboard</h2>
      <p class="muted">Welcome, ${escapeHtml(profile.full_name || "Company member")}.</p>
      <div class="card"><h3>Post a job</h3><p>Publish an opening for operators.</p><button onclick="showJobs()">Create a job</button></div>
      <div class="card"><h3>My jobs</h3><p>Manage jobs posted by this account.</p><button onclick="showMyJobs()">View my jobs</button></div>
      <div class="card"><h3>Applications</h3><p>Review applicants and update their status.</p><button onclick="showApplications()">View applications</button></div>
      <div class="card"><h3>Find operators</h3><button onclick="showOperators()">Browse operators</button></div>
      <div class="card"><h3>Company profile</h3><button onclick="showProfile()">View profile</button></div>
    `;
    return;
  }

  const fields = [profile.full_name, profile.operator_type, profile.city, profile.experience_years, profile.about];
  const completion = Math.round(fields.filter(value => value !== null && value !== undefined && String(value).trim() !== "").length / fields.length * 100);
  content.innerHTML = `
    <h2>Operator Dashboard</h2>
    <p class="muted">Welcome, ${escapeHtml(profile.full_name || "Operator")}.</p>
    <div class="card"><h3>Profile completion: ${completion}%</h3><p>Complete your profile so companies can learn about your experience.</p><button onclick="showProfile()">My profile</button></div>
    <div class="card"><h3>Browse jobs</h3><button onclick="showJobs()">Find jobs</button></div>
    <div class="card"><h3>Need a replacement?</h3><p>Post the dates and details for an operator to cover your shift.</p><button onclick="showJobs('replacement')">Need a Replacement</button></div>
    <div class="card"><h3>My applications</h3><button onclick="showApplications()">View applications</button></div>
    <div class="card"><h3>Discover operators</h3><button onclick="showOperators()">Open operator directory</button></div>
  `;
}

async function showMyJobs() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  if (profile?.account_type !== "company") { showDashboard(); return; }
  hideAll();
  const content = document.getElementById("content");
  document.getElementById("mainContent").classList.remove("hidden");
  content.innerHTML = "<h2>My Jobs</h2><p class='muted'>Loading...</p>";
  const { data: jobs, error } = await supabaseClient.from("jobs")
    .select("id, title, operator_type, company, city, country, description, salary")
    .eq("created_by", user.id).order("created_at", { ascending: false });
  if (error) {
    content.innerHTML = "<h2>My Jobs</h2><p class='muted'>Could not load your jobs.</p>";
    return;
  }
  content.innerHTML = "<h2>My Jobs</h2><button onclick=\"showDashboard()\">Back to Dashboard</button>" +
    (jobs?.length ? jobs.map(job => `
      <div class="card">
        <h3>${escapeHtml(job.title)}</h3><p>${escapeHtml(job.company || "")}</p>
        <p class="muted">Looking for: ${escapeHtml(job.operator_type || "Not specified")}</p>
        <p class="muted">${escapeHtml(job.city || "")}${job.country ? ", " + escapeHtml(job.country) : ""}</p>
        <p>${escapeHtml(job.description || "")}</p><p>Salary: ${escapeHtml(job.salary || "Not specified")}</p>
        <button onclick="editJob(${Number(job.id)})">Edit</button>
        <button class="secondary" onclick="deleteJob(${Number(job.id)})">Delete</button>
      </div>`).join("") : "<p class=\"muted\">You have not posted any jobs yet.</p>");
}

async function editJob(jobId) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }
  const { data: job } = await supabaseClient.from("jobs").select("*")
    .eq("id", jobId).eq("created_by", user.id).maybeSingle();
  if (!job) { alert("Job not found or you do not own it."); return; }
  const title = prompt("Job title", job.title || "");
  if (title === null) return;
  const operatorType = prompt("Operator type sought", job.operator_type || "");
  if (operatorType === null) return;
  const description = prompt("Description", job.description || "");
  if (description === null) return;
  const company = prompt("Company name", job.company || "");
  if (company === null) return;
  const city = prompt("City", job.city || "");
  if (city === null) return;
  const country = prompt("Country", job.country || "Georgia");
  if (country === null) return;
  const salary = prompt("Salary", job.salary || "");
  if (salary === null) return;
  const { error } = await supabaseClient.from("jobs").update({
    title: title.trim(), operator_type: operatorType.trim(), description: description.trim(), company: company.trim(),
    city: city.trim(), country: country.trim(), salary: salary.trim()
  }).eq("id", jobId).eq("created_by", user.id);
  if (error) { alert("Could not update job: " + error.message); return; }
  await showMyJobs();
}

async function deleteJob(jobId) {
  if (!confirm("Delete this job? This cannot be undone.")) return;
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }
  const { error } = await supabaseClient.from("jobs").delete()
    .eq("id", jobId).eq("created_by", user.id);
  if (error) { alert("Could not delete job: " + error.message); return; }
  await showMyJobs();
}

let operatorDirectory = [];

async function showOperators() {

  hideAll();
  document.getElementById("mainContent").classList.remove("hidden");
  const content = document.getElementById("content");
  content.innerHTML = "<h2>Operators</h2><p class='muted'>Loading...</p>";

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, full_name, operator_type, city, country, experience_years, about, is_employed, looking_for_permanent_job, needs_replacement, available_for_replacement, created_at")
    .eq("account_type", "operator")
    .eq("is_employed", false)
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Could not load operators:", error);
    content.innerHTML = "<h2>Operators</h2><p class='muted'>Could not load operators. Please try again later.</p>";
    return;
  }

  operatorDirectory = data || [];
  content.innerHTML = `
    <h2>Operators</h2>
    <input type="search" id="operatorSearch" placeholder="Search by name, profession or location" oninput="filterOperators(this.value)" aria-label="Search operators" style="width:100%; padding:12px; margin:16px 0; border-radius:8px; border:1px solid #303945; background:#121820; color:white;">
    <div id="operatorResults"></div>
  `;
  renderOperators(operatorDirectory);
}

function filterOperators(query) {
  const term = String(query || "").trim().toLocaleLowerCase();
  const matches = operatorDirectory.filter(operator =>
    [operator.full_name, operator.operator_type, operator.city, operator.country, operator.about]
      .some(value => String(value || "").toLocaleLowerCase().includes(term))
  );
  renderOperators(matches, Boolean(term));
}

function renderOperators(operators, searched = false) {
  const results = document.getElementById("operatorResults");
  if (!results) return;
  if (!operators.length) {
    results.innerHTML = `<p class="muted">${searched ? "No operators match your search." : "No operators yet."}</p>`;
    return;
  }
  results.innerHTML = operators.map(operator => `
    <div class="card">
      <h3 onclick="showOperatorProfile('${escapeHtml(operator.id)}')" style="cursor:pointer;">${escapeHtml(operator.full_name || "Operator")}</h3>
      <p class="muted">${escapeHtml(operator.operator_type || "Operator")}</p>
      <p>${escapeHtml(operator.city || "")}${operator.country ? ", " + escapeHtml(operator.country) : ""}</p>
      <p>Experience: ${escapeHtml(operator.experience_years ?? 0)} years</p>
      ${renderOperatorStatuses(operator)}
      <p>${escapeHtml(operator.about || "")}</p>
    </div>
  `).join("");
}

function renderOperatorStatuses(operator) {
  const badges = [];
  if (operator.is_employed === false) badges.push("⚪ Not currently employed");
  if (operator.is_employed === false && operator.looking_for_permanent_job === true) badges.push("🔎 Looking for permanent job");
  if (operator.is_employed === false && operator.available_for_replacement === true) badges.push("🔄 Available for replacement");
  if (!badges.length) return "";
  return `<div class="status-badges">${badges.map(label => `<span class="status-badge">${label}</span>`).join("")}</div>`;
}

async function showOperatorProfile(operatorId) {

  hideAll();

  const mainContent = document.getElementById("mainContent");
  const content = document.getElementById("content");
  mainContent.classList.remove("hidden");
  content.innerHTML =
    "<h2>Operator Profile</h2><p class=\"muted\">Loading profile...</p>";

  if (!operatorId) {
    content.innerHTML =
      "<p class=\"muted\">Operator profile not found.</p>" +
      "<button onclick=\"showOperators()\">Back to Operators</button>";
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("full_name, operator_type, city, country, experience_years, about, phone")
    .eq("id", operatorId)
    .eq("account_type", "operator")
    .single();

  if (error || !data) {
    console.error("Could not load operator profile:", error);
    content.innerHTML =
      "<p class=\"muted\">Could not load this operator profile.</p>" +
      "<button onclick=\"showOperators()\">Back to Operators</button>";
    return;
  }

  const name = escapeHtml(data.full_name || "Operator");
  const operatorType = escapeHtml(data.operator_type || "Operator");
  const city = escapeHtml(data.city || "");
  const country = escapeHtml(data.country || "");
  const location = [city, country].filter(Boolean).join(", ");
  const experience = escapeHtml(data.experience_years ?? 0);
  const about = escapeHtml(data.about || "No description provided.");
  const phone = String(data.phone || "").trim();
  const phoneLink = phone.replace(/[^+\d]/g, "");
  const contactMarkup = phoneLink
    ? `<p>Phone: ${escapeHtml(phone)}</p><a href="tel:${escapeHtml(phoneLink)}" style="display:inline-block; background:white; color:black; text-decoration:none; padding:10px 16px; border-radius:8px; font-weight:bold;">Contact operator</a>`
    : "<p class=\"muted\">No phone number provided.</p>";

  content.innerHTML = `
    <button class="secondary" onclick="showOperators()">Back to Operators</button>
    <div class="card" style="margin-top: 15px;">
      <h2>${name}</h2>
      <p class="muted">${operatorType}</p>
      <p>${location || "Location not specified"}</p>
      <p>Experience: ${experience} years</p>
      ${contactMarkup}
      <p style="white-space: pre-wrap; margin-top: 15px;">${about}</p>
    </div>
  `;
}

async function showCompanyProfile(companyId) {
  hideAll();
  const content = document.getElementById("content");
  document.getElementById("mainContent").classList.remove("hidden");
  content.innerHTML = "<h2>Company Profile</h2><p class='muted'>Loading profile...</p>";
  if (!companyId) {
    content.innerHTML = "<p class='muted'>Company profile not found.</p><button onclick=\"showJobs('replacement')\">Back to Jobs</button>";
    return;
  }
  const { data, error } = await supabaseClient.from("profiles")
    .select("full_name, city, country, about, phone")
    .eq("id", companyId)
    .eq("account_type", "company")
    .single();
  if (error || !data) {
    content.innerHTML = "<p class='muted'>Could not load this company profile.</p><button onclick=\"showJobs('replacement')\">Back to Jobs</button>";
    return;
  }
  content.innerHTML = `
    <button class="secondary" onclick="showJobs('replacement')">Back to Jobs</button>
    <div class="card" style="margin-top:15px;">
      <h2>${escapeHtml(data.full_name || "Company")}</h2>
      <p>${escapeHtml(data.city || "")}${data.country ? ", " + escapeHtml(data.country) : ""}</p>
      <p style="white-space:pre-wrap; margin-top:15px;">${escapeHtml(data.about || "")}</p>
      ${data.phone ? `<p>Phone: ${escapeHtml(data.phone)}</p>` : ""}
    </div>`;
}

async function showPublicProfile(profileId) {
  if (!profileId) return;
  const { data, error } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", profileId).maybeSingle();
  if (error || !data) {
    document.getElementById("content").innerHTML = "<p class='muted'>Profile not found.</p>";
    document.getElementById("mainContent").classList.remove("hidden");
    return;
  }
  if (data.account_type === "company") return showCompanyProfile(profileId);
  if (data.account_type === "operator") return showOperatorProfile(profileId);
}

let availableJobs = [];
let currentAccountType = "";
let currentJobCategory = "all";
let currentJobSearchTerm = "";

async function showJobs(category = "all") {

  currentJobCategory = ["all", "regular", "replacement"].includes(category) ? category : "all";
  currentJobSearchTerm = "";
  hideAll();
  document.getElementById("mainContent").classList.remove("hidden");
  const content = document.getElementById("content");
  content.innerHTML = "<h2>Jobs</h2><p class='muted'>Loading...</p>";

  const { data: { user } } = await supabaseClient.auth.getUser();
  let accountProfile = null;
  if (user) {
    const { data } = await supabaseClient.from("profiles")
      .select("account_type").eq("id", user.id).maybeSingle();
    accountProfile = data;
  }
  currentAccountType = accountProfile?.account_type || "";

  const companyForm = currentAccountType === "company" && currentJobCategory !== "replacement" ? `
    <div class="card">
      <h3>Post a regular job</h3>
      <div class="form" style="margin:15px 0 0; padding:0; background:transparent; border:0;">
        <input id="jobTitle" type="text" placeholder="Job title" required>
        <label for="jobOperatorType">What type of operator are you looking for?</label>
        <select id="jobOperatorType" required>
          <option value="">Select operator type</option>
          <option value="Tower Crane Operator">Tower Crane Operator</option>
          <option value="Mobile Crane Operator">Mobile Crane Operator</option>
          <option value="Excavator Operator">Excavator Operator</option>
          <option value="Loader Operator">Loader Operator</option>
          <option value="Forklift Operator">Forklift Operator</option>
          <option value="Other">Other</option>
        </select>
        <input id="jobCompany" type="text" placeholder="Company name">
        <input id="jobCity" type="text" placeholder="City">
        <input id="jobCountry" type="text" placeholder="Country">
        <textarea id="jobDescription" placeholder="Job description"></textarea>
        <input id="jobSalary" type="text" placeholder="Salary (optional)">
        <button onclick="publishJob()">Publish job</button>
        <p class="status" id="jobStatus"></p>
      </div>
    </div>
  ` : "";

  const replacementForm = ["operator", "company"].includes(currentAccountType) && currentJobCategory === "replacement" ? `
    <div class="card">
      <h3>🔄 ${currentAccountType === "company" ? "Post a replacement job" : "Need a replacement?"}</h3>
      <div class="form" style="margin:15px 0 0; padding:0; background:transparent; border:0;">
        <input id="replacementTitle" type="text" value="Replacement Needed" placeholder="Title" required>
        <label for="replacementDate">Date</label>
        <input id="replacementDate" type="date" required>
        <label for="replacementStartTime">Start time</label>
        <input id="replacementStartTime" type="time" required>
        <label for="replacementEndTime">End time</label>
        <input id="replacementEndTime" type="time" required>
        <input id="replacementCity" type="text" placeholder="Location / city" required>
        <input id="replacementCountry" type="text" value="Georgia" placeholder="Country">
        <label for="replacementOperatorType">Crane / operator type</label>
        <select id="replacementOperatorType" required>
          <option value="">Select type</option>
          <option value="Tower Crane Operator">Tower Crane Operator</option>
          <option value="Mobile Crane Operator">Mobile Crane Operator</option>
          <option value="Excavator Operator">Excavator Operator</option>
          <option value="Loader Operator">Loader Operator</option>
          <option value="Forklift Operator">Forklift Operator</option>
          <option value="Other">Other</option>
        </select>
        <input id="replacementPayment" type="number" min="0" step="0.01" placeholder="Payment (GEL)" required>
        <textarea id="replacementDescription" placeholder="Description / additional information"></textarea>
        <button onclick="publishReplacementJob()">Publish replacement request</button>
        <p class="status" id="replacementJobStatus"></p>
      </div>
    </div>
  ` : "";

  const { data, error } = await supabaseClient
    .from("jobs")
    .select("id, job_type, title, operator_type, company, city, country, description, salary, replacement_date, replacement_start_time, replacement_end_time, created_by, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Could not load jobs:", error);
    content.innerHTML = "<h2>Jobs</h2><p class=\"muted\">Could not load jobs. Please try again later.</p>";
    return;
  }

  availableJobs = data || [];
  const categoryTabs = `
    <div class="buttons" style="margin:16px 0;">
      <button class="${currentJobCategory === "all" ? "" : "secondary"}" onclick="filterJobCategory('all')">All Jobs</button>
      <button class="${currentJobCategory === "regular" ? "" : "secondary"}" onclick="filterJobCategory('regular')">Regular Jobs</button>
      <button class="${currentJobCategory === "replacement" ? "" : "secondary"}" onclick="filterJobCategory('replacement')">🔄 Replacement</button>
    </div>
  `;
  const roleMessage = currentJobCategory === "replacement" && currentAccountType === "company"
    ? ""
    : currentJobCategory === "replacement" && !currentAccountType
      ? "<p class=\"muted\">Log in as an Operator or Company to post a replacement job.</p>"
      : currentAccountType === "operator" && currentJobCategory !== "replacement"
        ? "<p class=\"muted\">Replacement requests can be posted from the Replacement category.</p>"
        : "";

  content.innerHTML = `
    <h2>Jobs</h2>
    ${categoryTabs}
    ${companyForm}
    ${replacementForm}
    ${roleMessage}
    <input type="search" id="jobSearch" placeholder="Search jobs by title, operator type or location" oninput="filterJobs(this.value)" aria-label="Search jobs" style="width:100%; padding:12px; margin:16px 0; border-radius:8px; border:1px solid #303945; background:#121820; color:white;">
    <div id="jobResults"></div>
  `;
  renderJobs();
}

function filterJobCategory(category) {
  if (!["all", "regular", "replacement"].includes(category)) return;
  currentJobCategory = category;
  showJobs(category);
}

function filterJobs(query) {
  currentJobSearchTerm = String(query || "").trim().toLocaleLowerCase();
  renderJobs();
}

function renderJobs() {
  const results = document.getElementById("jobResults");
  if (!results) return;
  const jobs = availableJobs.filter(job => {
    const type = job.job_type || "regular";
    const categoryMatches = currentJobCategory === "all" || type === currentJobCategory;
    const searchMatches = [job.title, job.operator_type, job.company, job.city, job.country, job.description, job.salary]
      .some(value => String(value || "").toLocaleLowerCase().includes(currentJobSearchTerm));
    return categoryMatches && searchMatches;
  });
  if (!jobs.length) {
    results.innerHTML = `<p class="muted">${currentJobSearchTerm ? "No jobs match your search." : "No jobs available in this category yet."}</p>`;
    return;
  }
  results.innerHTML = jobs.map(job => {
    const isReplacement = job.job_type === "replacement";
    if (isReplacement) {
      const day = job.replacement_date
        ? new Date(`${job.replacement_date}T00:00:00`).toLocaleDateString(undefined, { day: "2-digit", month: "short" })
        : "Date not set";
      const startTime = String(job.replacement_start_time || "").slice(0, 5);
      const endTime = String(job.replacement_end_time || "").slice(0, 5);
      return `
        <div class="card">
          <h3>🔄 ${escapeHtml(job.title || "Replacement Needed")}</h3>
          <p>Date: ${escapeHtml(day)}</p>
          <p>Location: ${escapeHtml(job.city || "")}${job.country ? ", " + escapeHtml(job.country) : ""}</p>
          <p>Crane: ${escapeHtml(job.operator_type || "Not specified")}</p>
          <p>Time: ${escapeHtml(startTime)}${endTime ? "–" + escapeHtml(endTime) : ""}</p>
          <p>Payment: ${escapeHtml(job.salary || "Not specified")}</p>
          <p style="white-space:pre-wrap;">${escapeHtml(job.description || "")}</p>
          <p class="muted">Posted by: <button class="text-link" onclick="showPublicProfile('${escapeHtml(job.created_by || "")}')">${escapeHtml(job.company || "Operator")}</button></p>
          ${currentAccountType === "operator" ? `<button onclick="applyToJob(${Number(job.id)})">Apply</button>` : ""}
        </div>
      `;
    }
    return `
      <div class="card">
        <h3>${escapeHtml(job.title || "Untitled job")}</h3>
        <p>${escapeHtml(job.company || "")}</p>
        <p class="muted">Looking for: ${escapeHtml(job.operator_type || "Not specified")}</p>
        <p class="muted">${escapeHtml(job.city || "")}${job.country ? ", " + escapeHtml(job.country) : ""}</p>
        <p style="white-space:pre-wrap;">${escapeHtml(job.description || "")}</p>
        <p>Salary: ${escapeHtml(job.salary || "Not specified")}</p>
        ${currentAccountType === "operator" ? `<button onclick="applyToJob(${Number(job.id)})">Apply</button>` : ""}
      </div>
    `;
  }).join("");
}

async function publishJob() {
  const status = document.getElementById("jobStatus");
  const title = document.getElementById("jobTitle").value.trim();
  if (!title) { status.textContent = "Please enter a job title."; return; }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { status.textContent = "Please log in to publish a job."; return; }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  if (profile?.account_type !== "company") {
    status.textContent = "Only Company accounts can publish regular jobs.";
    return;
  }
  const operatorType = document.getElementById("jobOperatorType").value;
  if (!operatorType) { status.textContent = "Please select the type of operator you are looking for."; return; }

  status.textContent = "Publishing job...";
  const { error } = await supabaseClient.from("jobs").insert({
    title,
    job_type: "regular",
    company: document.getElementById("jobCompany").value.trim(),
    city: document.getElementById("jobCity").value.trim(),
    country: document.getElementById("jobCountry").value.trim(),
    description: document.getElementById("jobDescription").value.trim(),
    salary: document.getElementById("jobSalary").value.trim(),
    operator_type: operatorType,
    created_by: user.id
  });
  if (error) { console.error("Could not publish job:", error); status.textContent = "Could not publish job: " + error.message; return; }
  await showJobs("regular");
}

async function publishReplacementJob() {
  const status = document.getElementById("replacementJobStatus");
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { status.textContent = "Please log in as an Operator."; return; }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type, phone, full_name").eq("id", user.id).maybeSingle();
  if (!["operator", "company"].includes(profile?.account_type)) {
    status.textContent = "Only Operator and Company accounts can post replacement jobs.";
    return;
  }

  const title = document.getElementById("replacementTitle").value.trim() || "Replacement Needed";
  const date = document.getElementById("replacementDate").value;
  const startTime = document.getElementById("replacementStartTime").value;
  const endTime = document.getElementById("replacementEndTime").value;
  const city = document.getElementById("replacementCity").value.trim();
  const country = document.getElementById("replacementCountry").value.trim() || "Georgia";
  const operatorType = document.getElementById("replacementOperatorType").value;
  const payment = Number(document.getElementById("replacementPayment").value);
  const description = document.getElementById("replacementDescription").value.trim();

  if (!date || !startTime || !endTime || startTime >= endTime || !city || !operatorType || !Number.isFinite(payment) || payment < 0) {
    status.textContent = "Enter a date, valid time range, location, operator type and payment.";
    return;
  }

  status.textContent = "Publishing replacement request...";
  const { error } = await supabaseClient.from("jobs").insert({
    title,
    job_type: "replacement",
    replacement_date: date,
    replacement_start_time: startTime,
    replacement_end_time: endTime,
    city,
    country,
    operator_type: operatorType,
    salary: `${payment} GEL`,
    description,
    company: profile.account_type === "company" ? (profile.full_name || "Company") : null,
    contact_phone: profile.phone || null,
    created_by: user.id
  });
  if (error) {
    console.error("Could not publish replacement request:", error);
    status.textContent = "Could not publish replacement request: " + error.message;
    return;
  }
  await showJobs("replacement");
}

async function applyToJob(jobId) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    showLogin();
    return;
  }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  if (profile?.account_type !== "operator") {
    alert("Only operator accounts can apply to jobs.");
    return;
  }
  const message = prompt("Add a short message to your application (optional):") || "";
  const { error } = await supabaseClient.from("applications").insert({
    job_id: jobId,
    applicant_id: user.id,
    message
  });
  if (error) {
    alert(error.code === "23505" ? "You have already applied to this job." : "Could not submit application: " + error.message);
    return;
  }
  alert("Application submitted.");
}

async function showApplications() {
  hideAll();
  const mainContent = document.getElementById("mainContent");
  const content = document.getElementById("content");
  mainContent.classList.remove("hidden");
  content.innerHTML = "<h2>Applications</h2><p class='muted'>Loading...</p>";
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  const accountType = profile?.account_type || "";
  const companyView = accountType === "company";
  const query = companyView
    ? "id, status, message, created_at, applicant_id, job_id, jobs(title), profiles!applications_applicant_id_fkey(full_name)"
    : "id, status, message, created_at, job_id, jobs(title, company, city, country)";
  const { data, error } = await supabaseClient.from("applications")
    .select(query).order("created_at", { ascending: false });
  if (error) {
    console.error("Could not load applications:", error);
    content.innerHTML = "<h2>Applications</h2><p class='muted'>Could not load applications. Check that the database migration and access policies are installed.</p>";
    return;
  }
  if (!data?.length) {
    content.innerHTML = `<h2>${companyView ? "Applications to your jobs" : "My Applications"}</h2><p class="muted">${companyView ? "No applications received yet." : "You have not applied to any jobs yet."}</p>`;
    return;
  }
  content.innerHTML = `<h2>${companyView ? "Applications to your jobs" : "My Applications"}</h2>` + data.map(application => `
    <div class="card">
      <h3>${escapeHtml(companyView ? application.jobs?.title || "Job" : application.jobs?.title || "Job")}</h3>
      ${companyView ? `<p>Operator: ${escapeHtml(application.profiles?.full_name || "Operator")}</p>` : `<p>${escapeHtml(application.jobs?.company || "")}${application.jobs?.city ? " · " + escapeHtml(application.jobs.city) : ""}</p>`}
      <p>${escapeHtml(application.message || "No message")}</p>
      <p class="muted">Status: ${escapeHtml(application.status || "Pending")}</p>
      ${companyView ? `<label>Status <select onchange="updateApplicationStatus(${Number(application.id)}, this.value)"><option ${application.status === "Pending" ? "selected" : ""}>Pending</option><option ${application.status === "Reviewed" ? "selected" : ""}>Reviewed</option><option ${application.status === "Accepted" ? "selected" : ""}>Accepted</option><option ${application.status === "Rejected" ? "selected" : ""}>Rejected</option></select></label>` : ""}
    </div>
  `).join("");
}

async function updateApplicationStatus(applicationId, status) {
  if (!["Pending", "Reviewed", "Accepted", "Rejected"].includes(status)) return;
  const { error } = await supabaseClient.from("applications")
    .update({ status }).eq("id", applicationId);
  if (error) {
    alert("Could not update application status: " + error.message);
    await showApplications();
    return;
  }
  await showApplications();
}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


supabaseClient.auth.onAuthStateChange((_event, session) => {
  updateAuthUI(!!session);
  setTimeout(() => updateHomeCTAs(session?.user || null), 0);
});

supabaseClient.auth.getSession().then(({ data }) => {
  const session = data?.session;
  updateAuthUI(!!session);
  updateHomeCTAs(session?.user || null);
  if (session) showDashboard();
});

</script>
