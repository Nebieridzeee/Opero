<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opero — Heavy Equipment Operator Network</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    nav button {
      background: none;
      border: none;
      color: #aaa;
      margin-left: 15px;
      cursor: pointer;
      font-size: 14px;
    }

    nav button:hover {
      color: white;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 50px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons button,
    .form button {
      background: white;
      color: black;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .buttons button.secondary {
      background: #1b222c;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .card {
      background: #121820;
      border: 1px solid #242c35;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .muted {
      color: #9299a3;
    }

    .form {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      background: #121820;
      border: 1px solid #242c35;
      border-radius: 14px;
    }

    .form h2 {
      margin-bottom: 20px;
    }

    .form input,
    .form textarea,
    .form select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #303945;
      background: #0b0f14;
      color: white;
    }

    .form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 50px 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OPERO</div>

  <nav>
    <button onclick="showHome()">Home</button>
    <button onclick="showOperators()">Operators</button>
    <button onclick="showJobs()">Jobs</button>
    <button id="loginNav" onclick="showLogin()">Login</button>
    <button id="registerNav" onclick="showRegister()">Register</button>
    <button id="profileNav" onclick="showProfile()">My Profile</button>
    <button id="logoutNav" class="hidden" onclick="logout()">Logout</button>
  </nav>
</header>


<section id="home">

  <div class="hero">

    <h1>Heavy Equipment Operator Network</h1>

    <p>
      Connect operators, companies and construction jobs.
    </p>

    <div class="buttons">
      <button onclick="showRegister()">Create Profile</button>
      <button class="secondary" onclick="showJobs()">Find Jobs</button>
    </div>

  </div>

</section>


<section id="mainContent" class="container hidden">

  <div id="content"></div>

</section>


<section id="loginSection" class="hidden">

  <div class="form">

    <h2>Login</h2>

    <input id="loginEmail" type="email" placeholder="Email">

    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p class="status" id="loginStatus"></p>

  </div>

</section>


<section id="registerSection" class="hidden">

  <div class="form">

    <h2>Create Operator Profile</h2>

    <input id="fullName" placeholder="Full name">

    <input id="registerEmail" type="email" placeholder="Email">

    <input id="registerPassword" type="password" placeholder="Password">

    <input id="phone" placeholder="Phone">

    <input id="city" placeholder="City">

    <input id="country" value="Georgia" placeholder="Country">

    <select id="operatorType">

      <option value="">Operator type</option>
      <option>Tower Crane Operator</option>
      <option>Mobile Crane Operator</option>
      <option>Excavator Operator</option>
      <option>Forklift Operator</option>
      <option>Loader Operator</option>
      <option>Bulldozer Operator</option>
      <option>Other</option>

    </select>

    <input id="experience" type="number" placeholder="Experience (years)">

    <textarea id="about" placeholder="About you / experience"></textarea>

    <button onclick="register()">Create Account</button>

    <p class="status" id="registerStatus"></p>

  </div>

</section>


<footer>
  © 2026 Opero — Heavy Equipment Operator Network
</footer>


<script>

const SUPABASE_URL =
  "https://nghjkjrpsvmvpqntdbtp.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naGpranJwc3ZtdnBxbnRkYnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDQ5MjMsImV4cCI6MjEwNTgyMDkyM30.uWNx_dXsN_a3-BYmAG15NxBTIJugrCDaq5hkY49_HM0";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


function hideAll() {

  document.getElementById("home").classList.add("hidden");
  document.getElementById("mainContent").classList.add("hidden");
  document.getElementById("loginSection").classList.add("hidden");
  document.getElementById("registerSection").classList.add("hidden");

}


function showHome() {

  hideAll();

  document.getElementById("home").classList.remove("hidden");

}


function showLogin() {

  hideAll();

  document.getElementById("loginSection").classList.remove("hidden");

}


function showRegister() {

  hideAll();

  document.getElementById("registerSection").classList.remove("hidden");

}


async function register() {

  const fullName =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const phone =
    document.getElementById("phone").value.trim();

  const city =
    document.getElementById("city").value.trim();

  const country =
    document.getElementById("country").value.trim();

  const operatorType =
    document.getElementById("operatorType").value;

  const experience =
    document.getElementById("experience").value;

  const about =
    document.getElementById("about").value.trim();

  const status =
    document.getElementById("registerStatus");


  status.textContent = "Creating account...";


  if (!fullName || !email || !password) {

    status.textContent =
      "Please enter name, email and password.";

    return;

  }


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {
  data: {
    full_name: fullName,
    phone: phone,
    city: city,
    country: country,
    operator_type: operatorType,
    experience_years: experience,
    about: about
  }
}

    });


  if (error) {

    status.textContent = error.message;

    return;

  }


  if (!data.user) {

    status.textContent =
      "Registration failed.";

    return;

  }


  status.textContent =
    "Account created. You can now login.";


  setTimeout(() => {

    showLogin();

  }, 1500);

}


async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const status =
    document.getElementById("loginStatus");


  status.textContent = "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    status.textContent = error.message;

    return;

  }


  status.textContent =
    "Login successful!";


  updateAuthUI();

  setTimeout(() => {

    showHome();

  }, 700);

}


async function logout() {

  await supabaseClient.auth.signOut();

  updateAuthUI();

  showHome();

}


async function updateAuthUI() {

  const { data } =
    await supabaseClient.auth.getSession();

  const loggedIn =
    !!data.session;


  document
    .getElementById("loginNav")
    .classList.toggle("hidden", loggedIn);


  document
    .getElementById("registerNav")
    .classList.toggle("hidden", loggedIn);


  document
    .getElementById("logoutNav")
    .classList.toggle("hidden", !loggedIn);

    
    
  document.getElementById("profileNav").
  classList.toggle("hidden", !loggedIn);

}


async function showOperators() {

  hideAll();

  document
    .getElementById("mainContent")
    .classList.remove("hidden");


  const content =
    document.getElementById("content");


  content.innerHTML =
    "<h2>Operators</h2><p class='muted'>Loading...</p>";


  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .order("created_at", { ascending: false });


  if (error) {

    content.innerHTML =
      "<p>Error loading operators.</p>";

    return;

  }


  if (!data.length) {

    content.innerHTML =
      "<h2>Operators</h2><p class='muted'>No operators yet.</p>";

    return;

  }


  content.innerHTML =
    "<h2>Operators</h2>" +
    data.map(operator => `

      <div class="card">

        <h3>${escapeHtml(operator.full_name)}</h3>

        <p class="muted">
          ${escapeHtml(operator.operator_type || "Operator")}
        </p>

        <p>
          ${escapeHtml(operator.city || "")}
          ${operator.country ? ", " + escapeHtml(operator.country) : ""}
        </p>

        <p>
          Experience:
          ${operator.experience_years || 0} years
        </p>

        <p>
          ${escapeHtml(operator.about || "")}
        </p>

      </div>

    `).join("");

}


async function showJobs() {

  hideAll();

  document
    .getElementById("mainContent")
    .classList.remove("hidden");


  const content =
    document.getElementById("content");


  content.innerHTML =
    "<h2>Jobs</h2><p class='muted'>Loading...</p>";


  const { data, error } =
    await supabaseClient
      .from("jobs")
      .select("*")
      .order("created_at", { ascending: false });


  if (error) {

    content.innerHTML =
      "<p>Error loading jobs.</p>";

    return;

  }


  if (!data.length) {

    content.innerHTML =
      "<h2>Jobs</h2><p class='muted'>No jobs available yet.</p>";

    return;

  }


  content.innerHTML =
    "<h2>Jobs</h2>" +
    data.map(job => `

      <div class="card">

        <h3>${escapeHtml(job.title)}</h3>

        <p>${escapeHtml(job.company || "")}</p>

        <p class="muted">
          ${escapeHtml(job.city || "")},
          ${escapeHtml(job.country || "")}
        </p>

        <p>
          ${escapeHtml(job.description || "")}
        </p>

        <p>
          Salary:
          ${escapeHtml(job.salary || "Not specified")}
        </p>

      </div>

    `).join("");

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


supabaseClient.auth.onAuthStateChange(() => {

  updateAuthUI();

});


updateAuthUI();

</script>

</body>
</html>
