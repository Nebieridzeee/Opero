<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opero — Heavy Equipment Operator Network</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      padding: 0;
      border: 0;
      background: none;
      color: white;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }

    nav button {
      background: none;
      border: none;
      color: #aaa;
      margin-left: 15px;
      cursor: pointer;
      font-size: 14px;
    }

    nav button:hover {
      color: white;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 50px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons button,
    .form button {
      background: white;
      color: black;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .buttons button.secondary {
      background: #1b222c;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .card {
      background: #121820;
      border: 1px solid #242c35;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .muted {
      color: #9299a3;
    }

    button.text-link {
      padding: 0;
      border: 0;
      background: none;
      color: #d7dde5;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    .unread-badge {
      display: inline-block;
      min-width: 19px;
      padding: 2px 6px;
      margin-left: 4px;
      border-radius: 999px;
      background: #e65f5f;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
    }

    .notification-card.unread {
      border-color: #4a8ac7;
      background: #162433;
    }

    .notification-card.read {
      opacity: .78;
    }

    .notification-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .status-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border: 1px solid #303945;
      border-radius: 999px;
      background: #1b222c;
      color: #d7dde5;
      font-size: 13px;
    }

    .form {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      background: #121820;
      border: 1px solid #242c35;
      border-radius: 14px;
    }

    .form h2 {
      margin-bottom: 20px;
    }

    .form input,
    .form textarea,
    .form select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #303945;
      background: #0b0f14;
      color: white;
    }

    .form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 50px 20px;
    }
  </style>
</head>

<body>

<header>
  <button class="logo" type="button" onclick="goHomeAndRefresh()" aria-label="Opero home">OPERO</button>

  <nav>
    <button id="operatorsNav" class="hidden" onclick="showOperators()">Operators</button>
    <button id="jobsNav" class="hidden" onclick="showJobs()">Jobs</button>
    <button id="applicationsNav" class="hidden" onclick="showApplications()">Applications <span id="applicationsUnreadBadge" class="unread-badge hidden">0</span></button>
    <button id="dashboardNav" class="hidden" onclick="showDashboard()">Dashboard</button>
    <button id="loginNav" onclick="showLogin()">Login</button>
    <button id="profileNav" class="hidden" onclick="showProfile()">My Profile</button>
    <button id="logoutNav" class="hidden" onclick="logout()">Logout</button>
  </nav>
</header>


<section id="home">

  <div class="hero">

    <h1>Heavy Equipment Operator Network</h1>

    <p>
      Connect operators, companies and construction jobs.
    </p>

    <div class="buttons" id="homeCtas" aria-live="polite"></div>

  </div>

</section>


<section id="mainContent" class="container hidden">

  <div id="content"></div>

</section>

<section id="profileSection" class="hidden">

  <h2>My Profile</h2>

  <p class="muted">Account type: <strong id="profileAccountTypeLabel"></strong></p>

  <input id="profileName" type="text" placeholder="Full name">

  <div id="companyAddressField" class="hidden">
    <input id="profileCompanyAddress" type="text" placeholder="Company address">
  </div>

  <input id="profilePhone" type="text" placeholder="Phone">

  <input id="profileCity" type="text" placeholder="City">

  <input id="profileCountry" type="text" placeholder="Country">

  <div id="operatorTypeProfileField" class="hidden">
    <label for="profileOperatorType">What equipment do you operate?</label>
    <select id="profileOperatorType">
      <option value="">Select operator type</option>
      <option value="Tower Crane Operator">Tower Crane Operator</option>
      <option value="Mobile Crane Operator">Mobile Crane Operator</option>
      <option value="Excavator Operator">Excavator Operator</option>
      <option value="Loader Operator">Loader Operator</option>
      <option value="Forklift Operator">Forklift Operator</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div id="operatorAvailabilityFields" class="hidden">
    <label for="profileIsEmployed">Currently employed?</label>
    <select id="profileIsEmployed" onchange="toggleReplacementProfileFields()">
      <option value="">Select yes or no</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label for="profileLookingPermanent">Looking for a permanent job?</label>
    <select id="profileLookingPermanent">
      <option value="">Select yes or no</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <div id="needsReplacementField" class="hidden">
      <label for="profileNeedsReplacement">Needs a replacement sometimes?</label>
      <select id="profileNeedsReplacement">
        <option value="">Select yes or no</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <div id="availableReplacementField" class="hidden">
      <label for="profileAvailableReplacement">Available to work as a replacement?</label>
      <select id="profileAvailableReplacement">
        <option value="">Select yes or no</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
  </div>

  <div id="operatorExperienceProfileFields" class="hidden">
    <input id="profileExperience" type="number" placeholder="Experience years">
    <textarea id="profileAbout" placeholder="About you"></textarea>
  </div>

  <button onclick="saveProfile()">Save Profile</button>

  <p id="profileStatus"></p>

</section>


<section id="loginSection" class="hidden">

  <div class="form">

    <h2>Login</h2>

    <input id="loginEmail" type="email" placeholder="Email">

    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p class="status" id="loginStatus"></p>
    <p class="muted">Need an account? <button class="text-link" type="button" onclick="showRegister()">Register</button></p>

  </div>

</section>


<section id="registerSection" class="hidden">

  <div class="form">

    <h2>Create your Opero account</h2>

    <div class="buttons" role="group" aria-label="Account type">
      <button id="operatorAccountChoice" type="button" aria-pressed="true" onclick="setRegistrationAccountType('operator')">I am an operator</button>
      <button id="companyAccountChoice" type="button" class="secondary" aria-pressed="false" onclick="setRegistrationAccountType('company')">I represent a company</button>
    </div>
    <input id="accountType" type="hidden" value="operator">

    <div class="operator-registration-field">
      <input id="fullName" placeholder="Full name" autocomplete="name">
    </div>

    <div id="companyRegistrationFields" class="hidden">
      <input id="companyName" placeholder="Company name" autocomplete="organization">
      <input id="companyAddress" placeholder="Company address" autocomplete="street-address">
    </div>

    <input id="registerEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="registerPassword" type="password" placeholder="Password" autocomplete="new-password">
    <input id="registerPasswordConfirm" type="password" placeholder="Repeat password" autocomplete="new-password">
    <input id="phone" type="tel" placeholder="Phone" autocomplete="tel">

    <div class="operator-registration-field">
      <label for="registerIsEmployed">Are you currently employed?</label>
      <select id="registerIsEmployed">
        <option value="">Select yes or no</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <input id="city" placeholder="City" autocomplete="address-level2">
    <input id="country" placeholder="Country" autocomplete="country-name">

    <div class="operator-registration-field">
      <input id="experience" type="number" min="0" placeholder="Experience (years)">
      <label for="operatorType">What type of equipment do you operate?</label>
      <select id="operatorType">
        <option value="">Select equipment type</option>
        <option>Tower Crane Operator</option>
        <option>Mobile Crane Operator</option>
        <option>Excavator Operator</option>
        <option>Forklift Operator</option>
        <option>Loader Operator</option>
        <option>Bulldozer Operator</option>
        <option>Telehandler Operator</option>
        <option>Road Roller Operator</option>
        <option>Motor Grader Operator</option>
        <option>Concrete Pump Operator</option>
        <option>Backhoe Loader Operator</option>
        <option>Other</option>
      </select>
      <textarea id="about" placeholder="About you / experience"></textarea>
    </div>

    <button onclick="register()">Create Account</button>

    <p class="status" id="registerStatus"></p>
    <p class="muted">Already have an account? <button class="text-link" type="button" onclick="showLogin()">Login</button></p>

  </div>

</section>


<footer>
  © 2026 Opero — Heavy Equipment Operator Network
</footer>


<script>

const SUPABASE_URL =
  "https://nghjkjrpsvmvpqntdbtp.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naGpranJwc3ZtdnBxbnRkYnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDQ5MjMsImV4cCI6MjEwNTgyMDkyM30.uWNx_dXsN_a3-BYmAG15NxBTIJugrCDaq5hkY49_HM0";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const OPERO_HISTORY_KEY = "operoHistory";
let restoringAppHistory = false;

if (!window.history.state?.[OPERO_HISTORY_KEY]) {
  window.history.replaceState({ [OPERO_HISTORY_KEY]: true, view: "home", args: [] }, "", window.location.href);
}

function saveAppView(view, args = []) {
  if (restoringAppHistory) return;
  window.history.pushState({ [OPERO_HISTORY_KEY]: true, view, args }, "", window.location.href);
}

function goHomeAndRefresh() {
  try { sessionStorage.setItem("operoReturnHome", "1"); } catch (_) {}
  window.history.replaceState({ [OPERO_HISTORY_KEY]: true, view: "home", args: [] }, "", window.location.href);
  window.location.reload();
}

window.addEventListener("popstate", event => {
  const state = event.state;
  if (!state?.[OPERO_HISTORY_KEY]) return;

  const args = Array.isArray(state.args) ? state.args : [];
  const routes = {
    home: () => showHome(),
    login: () => showLogin(),
    register: () => showRegister(),
    profile: () => showProfile(),
    dashboard: () => showDashboard(),
    myJobs: () => showMyJobs(),
    operators: () => showOperators(),
    operatorProfile: () => showOperatorProfile(args[0]),
    companyProfile: () => showCompanyProfile(args[0]),
    replacementForm: () => showOperatorReplacementForm(),
    jobs: () => showJobs(args[0], args[1]),
    applications: () => showApplications(args[0], args[1])
  };
  const restore = routes[state.view];
  if (!restore) return;

  restoringAppHistory = true;
  Promise.resolve().then(restore).catch(error => console.error("Could not restore page:", error)).finally(() => {
    restoringAppHistory = false;
  });
});


function hideAll() {

  document.getElementById("home").classList.add("hidden");
  document.getElementById("mainContent").classList.add("hidden");
  document.getElementById("loginSection").classList.add("hidden");
  document.getElementById("registerSection").classList.add("hidden");
  document.getElementById("profileSection").classList.add("hidden");
}


function showHome() {

  saveAppView("home");
  hideAll();

  document.getElementById("home").classList.remove("hidden");

}


function showLogin() {

  saveAppView("login");
  hideAll();

  document.getElementById("loginSection").classList.remove("hidden");

}


function showRegister() {

  saveAppView("register");
  hideAll();

  document.getElementById("registerSection").classList.remove("hidden");

  setRegistrationAccountType(document.getElementById("accountType").value || "operator");

}

function setRegistrationAccountType(accountType) {
  const isCompany = accountType === "company";
  document.getElementById("accountType").value = isCompany ? "company" : "operator";
  document.getElementById("operatorAccountChoice").classList.toggle("secondary", isCompany);
  document.getElementById("companyAccountChoice").classList.toggle("secondary", !isCompany);
  document.getElementById("operatorAccountChoice").setAttribute("aria-pressed", String(!isCompany));
  document.getElementById("companyAccountChoice").setAttribute("aria-pressed", String(isCompany));
  document.querySelectorAll(".operator-registration-field").forEach(field => {
    field.classList.toggle("hidden", isCompany);
  });
  document.getElementById("companyRegistrationFields").classList.toggle("hidden", !isCompany);
}


async function register() {

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const passwordConfirm =
    document.getElementById("registerPasswordConfirm").value;

  const accountType =
    document.getElementById("accountType").value;

  const phone =
    document.getElementById("phone").value.trim();

  const city =
    document.getElementById("city").value.trim();

  const country =
    document.getElementById("country").value.trim();

  const isCompany = accountType === "company";
  const fullName = (isCompany
    ? document.getElementById("companyName").value
    : document.getElementById("fullName").value).trim();
  const companyAddress = isCompany
    ? document.getElementById("companyAddress").value.trim()
    : "";
  const operatorType = isCompany ? "" : document.getElementById("operatorType").value;

  const experience =
    document.getElementById("experience").value;

  const about =
    document.getElementById("about").value.trim();

  const isEmployed = isCompany ? null : choiceToBoolean(document.getElementById("registerIsEmployed").value);

  const status =
    document.getElementById("registerStatus");


  status.textContent = "Creating account...";


  if (!fullName || !email || !password || !passwordConfirm || !phone || !city || !country || (isCompany && !companyAddress)) {
    status.textContent = "Please complete all required fields.";
    return;
  }

  if (password !== passwordConfirm) {
    status.textContent = "Passwords do not match.";
    return;
  }

  if (!isCompany && isEmployed === null) {
    status.textContent = "Please select whether you are currently employed.";
    return;
  }

  if (!isCompany && !operatorType) {
    status.textContent = "Please select the equipment type you operate.";
    return;
  }

  const parsedExperience = experience === "" ? null : Number(experience);
  if (!isCompany && parsedExperience !== null && (!Number.isInteger(parsedExperience) || parsedExperience < 0)) {
    status.textContent = "Experience must be a whole number of zero or more.";

    return;

  }


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {
  data: {
    full_name: fullName,
    account_type: accountType,
    phone: phone,
    city: city,
    country: country,
    company_address: isCompany ? companyAddress : null,
    operator_type: isCompany ? null : operatorType || null,
    experience_years: isCompany ? null : parsedExperience,
    is_employed: isCompany ? null : isEmployed,
    looking_for_permanent_job: isCompany ? null : false,
    needs_replacement: null,
    available_for_replacement: null,
    about: isCompany ? null : about
  }
}

    });


  if (error) {

    status.textContent = error.message;

    return;

  }


  if (!data.user) {

    status.textContent =
      "Registration failed.";

    return;

  }


  status.textContent =
    "Account created. You can now login.";


  setTimeout(() => {

    showLogin();

  }, 1500);

}


async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const status =
    document.getElementById("loginStatus");


  status.textContent = "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    status.textContent = error.message;

    return;

  }


  status.textContent =
    "Login successful!";


  updateAuthUI(true);
  await updateHomeCTAs(data.user);
  await showDashboard();

}

async function showProfile() {
  saveAppView("profile");
  hideAll();

  const profileSection = document.getElementById("profileSection");

  if (!profileSection) {
    alert("Profile section not found");
    return;
  }

  profileSection.classList.remove("hidden");

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("Please login first");
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (error) {
    console.error(error);
    alert("Could not load profile");
    return;
  }

  await repairEmploymentStatus(user.id, data);

  document.getElementById("profileAccountTypeLabel").textContent =
    data.account_type === "company" ? "Company" : "Operator";

  document.getElementById("profileName").value =
    data.full_name || "";

  document.getElementById("profileName").placeholder = data.account_type === "company" ? "Company name" : "Full name";
  document.getElementById("companyAddressField").classList.toggle("hidden", data.account_type !== "company");
  document.getElementById("operatorExperienceProfileFields").classList.toggle("hidden", data.account_type !== "operator");
  document.getElementById("profileCompanyAddress").value = data.company_address || "";

  document.getElementById("profilePhone").value =
    data.phone || "";

  document.getElementById("profileCity").value =
    data.city || "";

  document.getElementById("profileCountry").value =
    data.country || "Georgia";

  document.getElementById("operatorTypeProfileField").classList.toggle(
    "hidden", data.account_type !== "operator"
  );
  document.getElementById("profileOperatorType").value =
    data.account_type === "operator" ? data.operator_type || "" : "";
  document.getElementById("operatorAvailabilityFields").classList.toggle(
    "hidden", data.account_type !== "operator"
  );
  document.getElementById("profileIsEmployed").value = booleanToChoice(data.is_employed);
  document.getElementById("profileLookingPermanent").value = booleanToChoice(data.looking_for_permanent_job);
  document.getElementById("profileNeedsReplacement").value = booleanToChoice(data.needs_replacement);
  document.getElementById("profileAvailableReplacement").value = booleanToChoice(data.available_for_replacement);
  toggleReplacementProfileFields();

  document.getElementById("profileExperience").value =
    data.experience_years || "";

  document.getElementById("profileAbout").value =
    data.about || "";
}


function booleanToChoice(value) {
  return value === true ? "yes" : value === false ? "no" : "";
}

function choiceToBoolean(value) {
  return value === "yes" ? true : value === "no" ? false : null;
}

async function repairEmploymentStatus(userId, profile) {
  if (profile?.account_type !== "operator" || profile.is_employed !== true || profile.looking_for_permanent_job !== true) return;
  const { error } = await supabaseClient.from("profiles")
    .update({ looking_for_permanent_job: false })
    .eq("id", userId)
    .eq("is_employed", true)
    .eq("looking_for_permanent_job", true);
  if (error) console.error("Could not correct employment status:", error);
  profile.looking_for_permanent_job = false;
}

function toggleReplacementProfileFields() {
  const employed = document.getElementById("profileIsEmployed")?.value;
  const permanentJob = document.getElementById("profileLookingPermanent");
  if (permanentJob) {
    permanentJob.disabled = employed === "yes";
    if (employed === "yes") permanentJob.value = "no";
  }
  document.getElementById("needsReplacementField")?.classList.toggle("hidden", employed !== "yes");
  document.getElementById("availableReplacementField")?.classList.toggle("hidden", employed !== "no");
}

async function saveProfile() {

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    alert("Please login first");
    return;
  }

  const { data: profile, error: profileError } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).single();
  if (profileError || !profile) {
    alert("Could not load account type. Please reload and try again.");
    return;
  }

  const updates = {
    full_name: document.getElementById("profileName").value.trim(),
    phone: document.getElementById("profilePhone").value.trim(),
    city: document.getElementById("profileCity").value.trim(),
    country: document.getElementById("profileCountry").value.trim(),
    experience_years: Number(document.getElementById("profileExperience").value) || null,
    about: document.getElementById("profileAbout").value.trim()
  };
  if (profile.account_type === "operator") {
    const employed = choiceToBoolean(document.getElementById("profileIsEmployed").value);
    updates.operator_type = document.getElementById("profileOperatorType").value;
    updates.is_employed = employed;
    updates.looking_for_permanent_job = employed === true
      ? false
      : choiceToBoolean(document.getElementById("profileLookingPermanent").value);
    updates.needs_replacement = employed === true
      ? choiceToBoolean(document.getElementById("profileNeedsReplacement").value)
      : null;
    updates.available_for_replacement = employed === false
      ? choiceToBoolean(document.getElementById("profileAvailableReplacement").value)
      : null;
  }

  const { error } = await supabaseClient.from("profiles")
    .update(updates).eq("id", user.id);
  if (error) {
    alert(error.message);
    return;
  }

  alert("Profile updated successfully!");
}

async function logout() {

  await supabaseClient.auth.signOut();

  updateAuthUI(false);
  updateHomeCTAs(null);

  showHome();

}


function updateAuthUI(loggedIn) {
  document.getElementById("loginNav").classList.toggle("hidden", loggedIn);
  document.getElementById("operatorsNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("jobsNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("logoutNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("applicationsNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("dashboardNav").classList.toggle("hidden", !loggedIn);
  document.getElementById("profileNav").classList.toggle("hidden", !loggedIn);
}

let notificationRealtimeChannel = null;
let notificationUserId = null;
let notificationCountRequest = 0;

async function refreshUnreadNotificationCount(userId = notificationUserId) {
  const badge = document.getElementById("applicationsUnreadBadge");
  if (!badge) return;
  const requestId = ++notificationCountRequest;
  if (!userId) {
    badge.textContent = "0";
    badge.classList.add("hidden");
    return;
  }
  const { count, error } = await supabaseClient.from("notifications")
    .select("id", { count: "exact", head: true })
    .eq("recipient_user_id", userId)
    .eq("is_read", false);
  if (requestId !== notificationCountRequest) return;
  if (error) {
    badge.classList.add("hidden");
    console.error("Could not load unread notification count:", error);
    return;
  }
  const unreadCount = count || 0;
  badge.textContent = String(unreadCount);
  badge.classList.toggle("hidden", unreadCount === 0);
}

function configureNotificationUpdates(user) {
  const nextUserId = user?.id || null;
  if (notificationRealtimeChannel && notificationUserId !== nextUserId) {
    supabaseClient.removeChannel(notificationRealtimeChannel);
    notificationRealtimeChannel = null;
  }
  notificationUserId = nextUserId;
  refreshUnreadNotificationCount(nextUserId);
  if (!nextUserId || notificationRealtimeChannel || typeof supabaseClient.channel !== "function") return;
  notificationRealtimeChannel = supabaseClient
    .channel(`notifications:${nextUserId}`)
    .on("postgres_changes", {
      event: "*",
      schema: "public",
      table: "notifications",
      filter: `recipient_user_id=eq.${nextUserId}`
    }, () => refreshUnreadNotificationCount(nextUserId))
    .subscribe();
}

async function editJob(jobId) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }
  const { data: profile, error: profileError } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  if (profileError || !["company", "operator"].includes(profile?.account_type)) {
    alert("You are not allowed to manage this post.");
    return;
  }
  const { data: job, error: jobError } = await supabaseClient.from("jobs").select("*")
    .eq("id", jobId).eq("created_by", user.id).maybeSingle();
  if (jobError || !job || (profile.account_type === "operator" && job.job_type !== "replacement")) {
    alert("Job not found or you do not have permission to edit it.");
    return;
  }

  const title = prompt("Job title", job.title || "");
  if (title === null) return;
  const operatorType = prompt("Operator type sought", job.operator_type || "");
  if (operatorType === null) return;
  const description = prompt("Description", job.description || "");
  if (description === null) return;
  let company = job.company || "";
  if (profile.account_type === "company") {
    company = prompt("Company name", company);
    if (company === null) return;
  }
  const city = prompt("City", job.city || "");
  if (city === null) return;
  const country = prompt("Country", job.country || "Georgia");
  if (country === null) return;
  const salary = prompt("Salary", job.salary || "");
  if (salary === null) return;

  const updates = {
    title: title.trim(), operator_type: operatorType.trim(), description: description.trim(),
    company: company.trim() || null, city: city.trim(), country: country.trim(), salary: salary.trim()
  };
  if (job.job_type === "replacement") {
    const replacementDate = prompt("Replacement date (YYYY-MM-DD)", job.replacement_date || "");
    if (replacementDate === null) return;
    const replacementStartTime = prompt("Start time (HH:MM)", String(job.replacement_start_time || "").slice(0, 5));
    if (replacementStartTime === null) return;
    const replacementEndTime = prompt("End time (HH:MM)", String(job.replacement_end_time || "").slice(0, 5));
    if (replacementEndTime === null) return;
    if (!replacementDate || !replacementStartTime || !replacementEndTime || replacementStartTime >= replacementEndTime) {
      alert("Please enter a valid replacement date and time range.");
      return;
    }
    updates.replacement_date = replacementDate;
    updates.replacement_start_time = replacementStartTime;
    updates.replacement_end_time = replacementEndTime;
  }

  const { data, error } = await supabaseClient.from("jobs").update(updates)
    .eq("id", jobId).eq("created_by", user.id).select("id").maybeSingle();
  if (error) { alert("Could not update job: " + error.message); return; }
  if (!data) { alert("The database did not allow this update. Apply the Opero job-management migration in Supabase, then try again."); return; }
  await showMyJobs();
}

async function deleteJob(jobId) {
  if (!confirm("Delete this job? This cannot be undone.")) return;
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }
  const { data: profile, error: profileError } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  if (profileError || !["company", "operator"].includes(profile?.account_type)) {
    alert("You are not allowed to manage this post.");
    return;
  }
  let deleteQuery = supabaseClient.from("jobs").delete().eq("id", jobId).eq("created_by", user.id);
  if (profile.account_type === "operator") deleteQuery = deleteQuery.eq("job_type", "replacement");
  const { data, error } = await deleteQuery.select("id").maybeSingle();
  if (error) { alert("Could not delete job: " + error.message); return; }
  if (!data) { alert("The database did not allow this deletion. Apply the Opero job-management migration in Supabase, then try again."); return; }
  await showMyJobs();
}

function filterOperators(query) {
  const term = String(query || "").trim().toLocaleLowerCase();
  const matches = operatorDirectory.filter(operator =>
    [operator.full_name, operator.operator_type, operator.city, operator.country, operator.about]
      .some(value => String(value || "").toLocaleLowerCase().includes(term))
  );
  renderOperators(matches, Boolean(term));
}

function renderOperators(operators, searched = false) {
  const results = document.getElementById("operatorResults");
  if (!results) return;
  if (!operators.length) {
    results.innerHTML = `<p class="muted">${searched ? "No operators match your search." : "No operators yet."}</p>`;
    return;
  }
  results.innerHTML = operators.map(operator => `
    <div class="card">
      <h3 onclick="showOperatorProfile('${escapeHtml(operator.id)}')" style="cursor:pointer;">${escapeHtml(operator.full_name || "Operator")}</h3>
      <p class="muted">${escapeHtml(operator.operator_type || "Operator")}</p>

      <p>Experience: ${escapeHtml(operator.experience_years ?? 0)} years</p>
      ${renderOperatorStatuses(operator)}
      <p>${escapeHtml(operator.about || "")}</p>
    </div>
  `).join("");
}

function renderOperatorStatuses(operator) {
  const badges = [];
  if (operator.is_employed === false) badges.push("⚪ Not currently employed");
  if (operator.is_employed === false && operator.looking_for_permanent_job === true) badges.push("🔎 Looking for permanent job");
  if (operator.is_employed === false && operator.available_for_replacement === true) badges.push("🔄 Available for replacement");
  if (!badges.length) return "";
  return `<div class="status-badges">${badges.map(label => `<span class="status-badge">${label}</span>`).join("")}</div>`;
}

    ${companyForm}
    ${replacementForm}
    ${roleMessage}
    <input type="search" id="jobSearch" placeholder="Search jobs by title, operator type or location" oninput="filterJobs(this.value)" aria-label="Search jobs" style="width:100%; padding:12px; margin:16px 0; border-radius:8px; border:1px solid #303945; background:#121820; color:white;">
    <div id="jobResults"></div>
  `;
  renderJobs();
  if (focusJobId) setTimeout(() => document.getElementById(`job-${Number(focusJobId)}`)?.scrollIntoView?.({ behavior: "smooth", block: "start" }), 0);
}

function filterJobCategory(category) {
  if (!["all", "regular", "replacement"].includes(category)) return;
  currentJobCategory = category;
  showJobs(category);
}

function filterJobs(query) {
  currentJobSearchTerm = String(query || "").trim().toLocaleLowerCase();
  renderJobs();
}

function renderJobs() {
  const results = document.getElementById("jobResults");
  if (!results) return;
  const jobs = availableJobs.filter(job => {
    const type = job.job_type || "regular";
    const categoryMatches = currentJobCategory === "all" || type === currentJobCategory;
    const searchMatches = [job.title, job.operator_type, job.company, job.city, job.country, job.description, job.salary]
      .some(value => String(value || "").toLocaleLowerCase().includes(currentJobSearchTerm));
    return categoryMatches && searchMatches;
  });
  if (!jobs.length) {
    results.innerHTML = `<p class="muted">${currentJobSearchTerm ? "No jobs match your search." : "No jobs available in this category yet."}</p>`;
    return;
  }
  results.innerHTML = jobs.map(job => {
    const isReplacement = job.job_type === "replacement";
    if (isReplacement) {
      const day = job.replacement_date
        ? new Date(`${job.replacement_date}T00:00:00`).toLocaleDateString(undefined, { day: "2-digit", month: "short" })
        : "Date not set";
      const startTime = String(job.replacement_start_time || "").slice(0, 5);
      const endTime = String(job.replacement_end_time || "").slice(0, 5);
      return `
        <div class="card" id="job-${Number(job.id)}">
          <h3>🔄 ${escapeHtml(job.title || "Replacement Needed")}</h3>
          <p>Date: ${escapeHtml(day)}</p>
          <p>Location: ${escapeHtml(job.city || "")}${job.country ? ", " + escapeHtml(job.country) : ""}</p>
          <p>Crane: ${escapeHtml(job.operator_type || "Not specified")}</p>
          <p>Time: ${escapeHtml(startTime)}${endTime ? "–" + escapeHtml(endTime) : ""}</p>
          <p>Payment: ${escapeHtml(job.salary || "Not specified")}</p>
          <p style="white-space:pre-wrap;">${escapeHtml(job.description || "")}</p>
          <p class="muted">Posted by: <button class="text-link" onclick="showPublicProfile('${escapeHtml(job.created_by || "")}')">${escapeHtml(job.company || "Operator")}</button></p>
          ${currentAccountType === "operator" && currentUserEmployed !== true ? `<button onclick="applyToJob(${Number(job.id)})">Apply</button>` : ""}
        </div>
      `;
    }
    return `
      <div class="card" id="job-${Number(job.id)}">
        <h3>${escapeHtml(job.title || "Untitled job")}</h3>
        <p class="muted">Posted by: <button class="text-link" onclick="showPublicProfile('${escapeHtml(job.created_by || "")}')">${escapeHtml(job.company || "Company")}</button></p>
        <p class="muted">Looking for: ${escapeHtml(job.operator_type || "Not specified")}</p>
        <p class="muted">${escapeHtml(job.city || "")}${job.country ? ", " + escapeHtml(job.country) : ""}</p>
        <p style="white-space:pre-wrap;">${escapeHtml(job.description || "")}</p>
        <p>Salary: ${escapeHtml(job.salary || "Not specified")}</p>
        ${currentAccountType === "operator" && currentUserEmployed !== true ? `<button onclick="applyToJob(${Number(job.id)})">Apply</button>` : ""}
      </div>
    `;
  }).join("");
}

async function publishJob() {
  const status = document.getElementById("jobStatus");
  const title = document.getElementById("jobTitle").value.trim();
  if (!title) { status.textContent = "Please enter a job title."; return; }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { status.textContent = "Please log in to publish a job."; return; }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type").eq("id", user.id).maybeSingle();
  if (profile?.account_type !== "company") {
    status.textContent = "Only Company accounts can publish regular jobs.";
    return;
  }
  const operatorType = document.getElementById("jobOperatorType").value;
  if (!operatorType) { status.textContent = "Please select the type of operator you are looking for."; return; }

  status.textContent = "Publishing job...";
  const { error } = await supabaseClient.from("jobs").insert({
    title,
    job_type: "regular",
    company: document.getElementById("jobCompany").value.trim(),
    city: document.getElementById("jobCity").value.trim(),
    country: document.getElementById("jobCountry").value.trim(),
    description: document.getElementById("jobDescription").value.trim(),
    salary: document.getElementById("jobSalary").value.trim(),
    operator_type: operatorType,
    created_by: user.id
  });
  if (error) { console.error("Could not publish job:", error); status.textContent = "Could not publish job: " + error.message; return; }
  await showJobs("regular");
}

async function publishReplacementJob() {
  const status = document.getElementById("replacementJobStatus");
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { status.textContent = "Please log in as an Operator."; return; }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type, phone, full_name").eq("id", user.id).maybeSingle();
  if (!["operator", "company"].includes(profile?.account_type)) {
    status.textContent = "Only Operator and Company accounts can post replacement jobs.";
    return;
  }

  const title = document.getElementById("replacementTitle").value.trim() || "Replacement Needed";
  const date = document.getElementById("replacementDate").value;
  const startTime = document.getElementById("replacementStartTime").value;
  const endTime = document.getElementById("replacementEndTime").value;
  const city = document.getElementById("replacementCity").value.trim();
  const country = document.getElementById("replacementCountry").value.trim() || "Georgia";
  const operatorType = document.getElementById("replacementOperatorType").value;
  const payment = Number(document.getElementById("replacementPayment").value);
  const description = document.getElementById("replacementDescription").value.trim();

  if (!date || !startTime || !endTime || startTime >= endTime || !city || !operatorType || !Number.isFinite(payment) || payment < 0) {
    status.textContent = "Enter a date, valid time range, location, operator type and payment.";
    return;
  }

  status.textContent = "Publishing replacement request...";
  const { error } = await supabaseClient.from("jobs").insert({
    title,
    job_type: "replacement",
    replacement_date: date,
    replacement_start_time: startTime,
    replacement_end_time: endTime,
    city,
    country,
    operator_type: operatorType,
    salary: `${payment} GEL`,
    description,
    company: profile.account_type === "company" ? (profile.full_name || "Company") : null,
    contact_phone: profile.phone || null,
    created_by: user.id
  });
  if (error) {
    console.error("Could not publish replacement request:", error);
    status.textContent = "Could not publish replacement request: " + error.message;
    return;
  }
  await showJobs("replacement");
}

async function applyToJob(jobId) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    showLogin();
    return;
  }
  const { data: profile } = await supabaseClient.from("profiles")
    .select("account_type, is_employed").eq("id", user.id).maybeSingle();
  if (profile?.account_type !== "operator") {
    alert("Only operator accounts can apply to jobs.");
    return;
  }
  if (profile.is_employed === true) {
    alert("Currently employed Operators cannot apply to jobs.");
    return;
  }
  const message = prompt("Add a short message to your application (optional):") || "";
  const { error } = await supabaseClient.from("applications").insert({
    job_id: jobId,
    applicant_id: user.id,
    message
  });
  if (error) {
    alert(error.code === "23505" ? "You have already applied to this job." : "Could not submit application: " + error.message);
    return;
  }
  alert("Application submitted.");
}

let currentNotificationCategory = "all";

function filterApplicationsCategory(category) {
  if (!["all", "job_application", "replacement", "system"].includes(category)) return;
  currentNotificationCategory = category;
  showApplications(category);
}

function formatNotificationTime(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
}

async function markNotificationRead(notificationId) {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  const { error } = await supabaseClient.from("notifications")
    .update({ is_read: true }).eq("id", notificationId).eq("recipient_user_id", user.id);
  if (error) console.error("Could not mark notification read:", error);
  await refreshUnreadNotificationCount(user.id);
}

async function openNotificationApplication(notificationId, applicationId) {
  await markNotificationRead(notificationId);
  await showApplications("all", applicationId);
}

async function openNotificationJob(notificationId, jobId, category) {
  await markNotificationRead(notificationId);
  await showJobs(category === "replacement" ? "replacement" : "all", jobId);
}

async function openNotificationProfile(notificationId, profileId) {
  await markNotificationRead(notificationId);
  await showPublicProfile(profileId);
}

async function showApplications(category = "all", focusApplicationId = null) {
  currentNotificationCategory = ["all", "job_application", "replacement", "system"].includes(category) ? category : "all";
  saveAppView("applications", [currentNotificationCategory, focusApplicationId]);
  hideAll();
  const mainContent = document.getElementById("mainContent");
  const content = document.getElementById("content");
  mainContent.classList.remove("hidden");
  content.innerHTML = "<h2>Applications</h2><p class='muted'>Loading...</p>";
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { showLogin(); return; }

  const [notificationResult, applicationResult] = await Promise.all([
    supabaseClient.from("notifications").select("*").eq("recipient_user_id", user.id).order("created_at", { ascending: false }),
    supabaseClient.from("applications").select("id, status, message, created_at, applicant_id, job_id, jobs(title, company, city, country, job_type, created_by), profiles!applications_applicant_id_fkey(full_name)").order("created_at", { ascending: false })
  ]);
  const { data: notifications, error: notificationError } = notificationResult;
  const { data: applications, error: applicationError } = applicationResult;
  if (notificationError || applicationError) {
    console.error("Could not load Applications history:", notificationError || applicationError);
    content.innerHTML = "<h2>Applications</h2><p class='muted'>Could not load your history. Check that the notifications migration and access policies are installed.</p>";
    return;
  }

  const notificationRows = notifications || [];
  const applicationRows = applications || [];
  const filteredNotifications = notificationRows.filter(item => currentNotificationCategory === "all" || item.category === currentNotificationCategory);
  const filteredApplications = applicationRows.filter(item => {
    const itemCategory = item.jobs?.job_type === "replacement" ? "replacement" : "job_application";
    return currentNotificationCategory === "all" || currentNotificationCategory === itemCategory;
  });
  const appById = new Map(applicationRows.map(application => [String(application.id), application]));
  const categories = [["all", "All"], ["job_application", "Job Applications"], ["replacement", "Replacement"], ["system", "System"]];
  const categoryTabs = `<div class="buttons" style="margin:16px 0;">${categories.map(([key, label]) => `<button class="${currentNotificationCategory === key ? "" : "secondary"}" onclick="filterApplicationsCategory('${key}')">${label}</button>`).join("")}</div>`;

  const notificationCards = filteredNotifications.length ? filteredNotifications.map(notification => {
    const application = notification.related_application_id == null ? null : appById.get(String(notification.related_application_id));
    const canRespond = application
      && application.jobs?.created_by === user.id
      && ["Pending", "Reviewed"].includes(application.status)
      && ["application_sent", "replacement_request_sent"].includes(notification.event_type);
    const profileAction = notification.related_profile_id
      ? `<button class="secondary" onclick="openNotificationProfile(${Number(notification.id)}, '${escapeHtml(notification.related_profile_id)}')">View Profile</button>`
      : "";
    const responseActions = canRespond
      ? `<button onclick="updateApplicationStatus(${Number(application.id)}, 'Accepted', ${Number(notification.id)})">Accept / Confirm</button><button class="secondary" onclick="updateApplicationStatus(${Number(application.id)}, 'Rejected', ${Number(notification.id)})">Decline</button>`
      : "";
    const markReadAction = !notification.is_read && !profileAction
      ? `<button class="secondary" onclick="markNotificationRead(${Number(notification.id)})">Mark read</button>`
      : "";
    return `<article class="card notification-card ${notification.is_read ? "read" : "unread"}">
      <h3>${escapeHtml(notification.title)}</h3><p>${escapeHtml(notification.message)}</p>
      <p class="muted">${escapeHtml(formatNotificationTime(notification.created_at))}</p>
      <div class="notification-actions">${profileAction}${responseActions}${markReadAction}</div>
    </article>`;
  }).join("") : `<p class="muted">No ${currentNotificationCategory === "all" ? "history" : "events in this category"} yet.</p>`;

  const applicationCards = filteredApplications.map(application => {
    const isOwner = application.jobs?.created_by === user.id;
    const isApplicant = application.applicant_id === user.id;
    if (!isOwner && !isApplicant) return "";
    const isReplacement = application.jobs?.job_type === "replacement";
    const status = application.status || "Pending";
    const applicantName = application.profiles?.full_name || "Operator";
    const inboxNotification = notificationRows.find(item =>
      item.recipient_user_id === user.id
      && String(item.related_application_id) === String(application.id)
      && ["application_sent", "replacement_request_sent"].includes(item.event_type)
      && !item.is_read
    );
    const inboxNotificationId = inboxNotification ? Number(inboxNotification.id) : "null";
    const actions = isOwner && ["Pending", "Reviewed"].includes(status)
      ? `<div class="notification-actions"><button onclick="updateApplicationStatus(${Number(application.id)}, 'Accepted', ${inboxNotificationId})">Accept / Confirm</button><button class="secondary" onclick="updateApplicationStatus(${Number(application.id)}, 'Rejected', ${inboxNotificationId})">Decline</button><label>Status <select onchange="updateApplicationStatus(${Number(application.id)}, this.value, ${inboxNotificationId})"><option ${status === "Pending" ? "selected" : ""}>Pending</option><option ${status === "Reviewed" ? "selected" : ""}>Reviewed</option></select></label></div>`
      : "";
    return `<article class="card" id="application-${Number(application.id)}">
      <h3>${escapeHtml(application.jobs?.title || "Job")}</h3>
      <p>${isOwner ? `From: <button class="text-link" onclick="showPublicProfile('${escapeHtml(application.applicant_id)}')">${escapeHtml(applicantName)}</button>` : `To: ${escapeHtml(application.jobs?.company || "Job owner")}`}</p>
      <p>${escapeHtml(application.message || (isReplacement ? "Replacement request" : "No message"))}</p>
      <p class="muted">${isReplacement ? "Replacement" : "Job application"} · ${escapeHtml(status)} · ${escapeHtml(formatNotificationTime(application.created_at))}</p>${actions}
    </article>`;
  }).join("");

  content.innerHTML = `<h2>Applications & History</h2>${categoryTabs}<h3>Notifications</h3>${notificationCards}<h3 style="margin-top:24px;">Applications and requests</h3>${applicationCards || `<p class="muted">No applications or replacement requests in this category.</p>`}`;
  await refreshUnreadNotificationCount(user.id);
  if (focusApplicationId) setTimeout(() => document.getElementById(`application-${Number(focusApplicationId)}`)?.scrollIntoView?.({ behavior: "smooth", block: "start" }), 0);
}

async function updateApplicationStatus(applicationId, status, notificationId = null) {
  if (!["Pending", "Reviewed", "Accepted", "Rejected"].includes(status)) return;
  const { error } = await supabaseClient.from("applications")
    .update({ status }).eq("id", applicationId);
  if (error) {
    alert("Could not update application status: " + error.message);
    await showApplications(currentNotificationCategory);
    return;
  }
  if (notificationId) await markNotificationRead(notificationId);
  await refreshUnreadNotificationCount();
  await showApplications(currentNotificationCategory);
}
function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


supabaseClient.auth.onAuthStateChange((_event, session) => {
  updateAuthUI(!!session);
  setTimeout(() => updateHomeCTAs(session?.user || null), 0);
  setTimeout(() => configureNotificationUpdates(session?.user || null), 0);
});

supabaseClient.auth.getSession().then(({ data }) => {
  const session = data?.session;
  updateAuthUI(!!session);
  updateHomeCTAs(session?.user || null);
  configureNotificationUpdates(session?.user || null);
  let returnToHome = false;
  try {
    returnToHome = sessionStorage.getItem("operoReturnHome") === "1";
    sessionStorage.removeItem("operoReturnHome");
  } catch (_) {}
  restoringAppHistory = true;
  Promise.resolve(returnToHome || !session ? showHome() : showDashboard()).finally(() => {
    restoringAppHistory = false;
  });
});

</script>
